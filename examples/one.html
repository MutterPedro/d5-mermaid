<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D5 one</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; height: 100%; overflow: hidden; }
    /* Pass ?static=1 for the old plain (unpannable, natural-size) render — used by the
       screenshot-based verification workflow, where a fixed full-viewport pan/zoom stage
       would change what a screenshot captures. */
    body.static { height: auto; overflow: visible; }
    #wrap { position: absolute; inset: 0; }
    body.static #wrap { position: static; overflow: visible; display: inline-block; padding: 12px; }
    #wrap svg { display: block; }
    .err { color: #b91c1c; font: 13px monospace; padding: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="wrap">loading…</div>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    const params = new URLSearchParams(location.search);
    const path = params.get('m');
    const isStatic = params.has('static');
    const withToggle = params.has('toggle');
    if (isStatic) document.body.classList.add('static');

    // The toggle checklist needs the parsed db (to filter + re-render), which
    // `mermaid.render()` never hands back — so `?toggle=1` bypasses it and calls this
    // package's own parse()/render() pair directly, dispatching on the diagram keyword.
    function renderWithToggle(mod, src, svg, container) {
      const kind = src.trim().split('\n')[0].trim();
      const table = {
        'd5-domain': [mod.D5DomainDb, mod.parseDomain, mod.attachDomainToggle],
        'd5-subdomain': [mod.D5SubdomainDb, mod.parseSubdomain, mod.attachSubdomainToggle],
        'd5-context': [mod.D5ContextDb, mod.parseContext, mod.attachContextToggle],
        'd5-aggregate': [mod.D5AggregateDb, mod.parseAggregate, mod.attachAggregateToggle],
      };
      const entry = table[kind];
      if (!entry) throw new Error(`unknown diagram type: ${kind}`);
      const [Db, parse, attachDiagramToggle] = entry;
      const db = new Db();
      parse(src, db);
      return attachDiagramToggle(svg, db, container, {
        onChange: () => window.__panZoom?.fit(),
      });
    }

    async function run() {
      const mod = await import('../dist/index.js?v=' + Date.now());
      const { d5Diagrams, attachPanZoom } = mod;
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
      await mermaid.registerExternalDiagrams(d5Diagrams);
      const md = await (await fetch(path)).text();
      const m = md.match(/```[^\n]*\n([\s\S]*?)```/);
      const src = (m ? m[1] : md).replace(/\s+$/, '');
      const wrap = document.getElementById('wrap');
      try {
        if (withToggle) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          wrap.appendChild(svg);
          window.__toggle = renderWithToggle(mod, src, svg, wrap);
          window.__svgSize = { w: svg.getBoundingClientRect().width, h: svg.getBoundingClientRect().height, vb: svg.getAttribute('viewBox') };
          if (!isStatic) window.__panZoom = attachPanZoom(svg, wrap);
        } else {
          const { svg } = await mermaid.render('one-svg', src);
          wrap.innerHTML = svg;
          const s = document.querySelector('svg');
          window.__svgSize = { w: s.getBoundingClientRect().width, h: s.getBoundingClientRect().height, vb: s.getAttribute('viewBox') };
          if (!isStatic) window.__panZoom = attachPanZoom(s, wrap);
        }
      } catch (e) {
        wrap.innerHTML = '<div class="err">' + (e && e.message || e) + '</div>';
      }
    }
    run();
  </script>
</body>
</html>
