name: Publish to npm

# Stages the package whenever the version in package.json is bumped on `main`.
# The version check makes the job idempotent: a push that does not change the
# version (or re-stages an already-live one) is a no-op.
#
# Auth is via npm Trusted Publishing (OIDC) — https://docs.npmjs.com/trusted-publishers
# No NPM_TOKEN / long-lived secret: npm CLI exchanges the job's GitHub OIDC
# token for a short-lived token, provided this exact workflow file
# (.github/workflows/publish.yml) is registered as a trusted publisher for
# the package on npmjs.com and `permissions.id-token: write` is set below.
# Requires npm CLI >= 11.5.1 and Node >= 22.14.0 (hence the explicit npm
# upgrade step — the version bundled with setup-node's Node install may be
# older than that).
#
# This trusted publisher is only authorised for `npm stage publish`, not a
# direct `npm publish` (npm's "staged publishing" — see
# https://docs.npmjs.com/staged-publishing). CI cannot go further than
# staging: approving a staged package requires 2FA / proof of presence, which
# only a human can provide, via `npm stage approve <stage-id>` or the
# "Staged Packages" tab on npmjs.com. `npm stage publish` itself needs no
# 2FA and works fine under OIDC.
#
# The staged tarball is kept minimal: package.json `files` only allow-lists
# the built JS/typings in dist/ (no .map files, no test/example/preview
# sources — see npm pack --dry-run to verify), and devDependencies are pruned
# from node_modules before staging so that step runs with only production
# dependencies installed.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC / trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Check whether this version is already live
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build while devDependencies (tsup, typescript) are still installed.
      - if: steps.check.outputs.exists == 'false'
        run: npm run build

      # Drop devDependencies so the stage step runs with only production
      # dependencies present. The staged tarball never contains node_modules
      # either way — this is a defence-in-depth / explicitness step, not
      # what keeps it small (the `files` allow-list in package.json does).
      - if: steps.check.outputs.exists == 'false'
        run: npm prune --omit=dev

      # --ignore-scripts: skip prepublishOnly (it re-runs the build, which
      # would fail now that devDependencies were pruned) — dist/ is already
      # built above. No token/env needed: npm authenticates via OIDC. This
      # only stages the package — see the header comment for why, and the
      # summary step below for how to approve it.
      - if: steps.check.outputs.exists == 'false'
        run: |
          echo "Staging ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}"
          npm stage publish --ignore-scripts --access public

      - name: Print approval instructions
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "## Staged — needs manual approval" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}\` was submitted to npm's staging area, not published live — this trusted publisher is only authorised for \`npm stage publish\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve it with 2FA, from your own machine:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage list ${{ steps.check.outputs.name }}   # find the stage-id" >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "...or open the **Staged Packages** tab on npmjs.com and click **Approve**." >> "$GITHUB_STEP_SUMMARY"

      - if: steps.check.outputs.exists == 'true'
        run: echo "${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} is already live — nothing to do."
